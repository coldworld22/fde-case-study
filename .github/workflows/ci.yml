name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Demo conversation
        if: matrix.python == '3.12'
        run: |
          echo '### Demo conversation' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m clinicbot.simulate --demo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinicbot
          POSTGRES_PASSWORD: clinicbot
          POSTGRES_DB: clinicbot
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U clinicbot" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://clinicbot:clinicbot@localhost:5432/clinicbot

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clinicbot:ci .
      - name: Smoke test
        run: |
          docker run -d --name bot -p 8000:8000 clinicbot:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health/ready && exit 0; sleep 1; done
          docker logs bot; exit 1
