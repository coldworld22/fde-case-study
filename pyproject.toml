[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicbot"
version = "1.0.0"
description = "WhatsApp appointment booking with safe triage and Odoo sync for a multi-branch clinic group."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "httpx==0.28.1",
    "pydantic-settings==2.6.1",
    "tzdata==2024.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.3"]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/clinicbot/messages.py" = ["E501"]
