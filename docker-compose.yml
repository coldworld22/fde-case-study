# Local stack: bot + worker + PostgreSQL, and optionally a real Odoo 17 to sync into.
#   docker compose up --build                      bot on http://localhost:8000
#   docker compose --profile odoo up --build       also Odoo on http://localhost:8069
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicbot
      POSTGRES_USER: clinicbot
      POSTGRES_PASSWORD: clinicbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicbot"]
      interval: 5s
      retries: 10
    volumes: [db:/var/lib/postgresql/data]

  bot:
    build: .
    env_file: .env
    environment:
      CLINICBOT_DATABASE_URL: postgresql+psycopg://clinicbot:clinicbot@db/clinicbot
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  seed:
    build: .
    env_file: .env
    environment:
      CLINICBOT_DATABASE_URL: postgresql+psycopg://clinicbot:clinicbot@db/clinicbot
    command: ["python", "-m", "clinicbot.seed"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    env_file: .env
    environment:
      CLINICBOT_DATABASE_URL: postgresql+psycopg://clinicbot:clinicbot@db/clinicbot
    command: ["python", "-m", "clinicbot.jobs"]
    depends_on:
      db: { condition: service_healthy }

  odoo-db:
    profiles: [odoo]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres

  odoo:
    profiles: [odoo]
    image: odoo:17
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    ports: ["8069:8069"]
    depends_on: [odoo-db]

volumes:
  db:
